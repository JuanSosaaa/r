<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Abriendo reseñas…</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f6f7f9; color: #1c1f23;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box; text-align: center;
  }
  main { max-width: 360px; }
  .giro {
    width: 36px; height: 36px; margin: 0 auto 20px;
    border: 3px solid #d5d9e0; border-top-color: #1a73e8; border-radius: 50%;
    animation: giro .8s linear infinite;
  }
  @keyframes giro { to { transform: rotate(360deg); } }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 16px; line-height: 1.45; margin: 0 0 12px; color: #4a5059; }
  .cod { font-size: 13px; color: #7a818c; margin-top: 20px; }
  a.boton {
    display: inline-block; margin-top: 8px; padding: 12px 22px; border-radius: 999px;
    background: #1a73e8; color: #fff; text-decoration: none; font-weight: 600;
  }
  [hidden] { display: none !important; }
  @media (prefers-color-scheme: dark) {
    body { background: #15171a; color: #eef0f3; }
    p { color: #b3b9c2; } .giro { border-color: #33383f; border-top-color: #8ab4f8; }
  }
</style>
</head>
<body>
<main>
  <div id="cargando">
    <div class="giro" aria-hidden="true"></div>
    <p>Abriendo la página de reseñas…</p>
    <a id="manual" class="boton" hidden>Abrir reseñas</a>
  </div>
  <div id="aviso" hidden>
    <h1 id="titulo"></h1>
    <p id="texto"></p>
    <p class="cod" id="cod"></p>
  </div>
  <noscript><p>Activa JavaScript en tu navegador para abrir la página de reseñas.</p></noscript>
</main>
<script src="config.js"></script>
<script src="comun.js"></script>
<script>
(function () {
  function aviso(titulo, texto, codigo) {
    document.title = titulo;
    document.getElementById("cargando").hidden = true;
    document.getElementById("titulo").textContent = titulo;
    document.getElementById("texto").textContent = texto;
    document.getElementById("cod").textContent = codigo ? "Código " + codigo : "";
    document.getElementById("aviso").hidden = false;
  }

  // Avisa al contador (si está configurado) sin retrasar la redirección.
  function contar(codigo) {
    var base = (window.CONFIG && window.CONFIG.CONTADOR_URL || "").trim();
    if (!base) return;
    var url = base + (base.indexOf("?") < 0 ? "?" : "&") + "c=" + codigo;
    try {
      fetch(url, { mode: "no-cors", keepalive: true, cache: "no-store" }).catch(function () {});
    } catch (e) {
      try { new Image().src = url; } catch (e2) {}
    }
  }

  var crudo = new URLSearchParams(location.search).get("c");
  var codigo = Comun.normalizarCodigo(crudo);

  if (!codigo) {
    aviso("Enlace incompleto",
          "A este enlace le falta el código del hablador. Escanea de nuevo el QR o acerca el celular otra vez.");
    return;
  }

  Comun.cargarCodigos("./").then(function (codigos) {
    var item = codigos[codigo];
    var destino = item && Comun.validarUrl(item.url);
    if (!destino) {
      if (item && typeof item.url === "string" && item.url.trim()) {
        aviso("Enlace no válido",
              "Este hablador tiene un enlace mal configurado. Por favor avisa en el negocio.", codigo);
      } else {
        aviso("Hablador sin activar",
              "Este hablador todavía no está asignado a ningún negocio. Vuelve a intentarlo más tarde.", codigo);
      }
      return;
    }
    contar(codigo);
    // Botón de respaldo por si el navegador bloquea la redirección.
    var manual = document.getElementById("manual");
    manual.href = destino;
    setTimeout(function () { manual.hidden = false; }, 2500);
    location.replace(destino);
  }).catch(function () {
    aviso("No se pudo abrir",
          "Hubo un problema al cargar la página. Revisa tu conexión a internet e inténtalo de nuevo.", codigo);
  });
})();
</script>
</body>
</html>
